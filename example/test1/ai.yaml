    name: "Deepgram"
    type: deepgram
    voice: aura-2-zeus-en
    cluster: "wss://api.deepgram.com/v1/speak"
    token: 你的token
    output_dir: "tmp/"
    sample_rate: 16000

# LLM配置
LLM:
  ChatGLMLLM:
    name: "ChatGLM"
    # 定义LLM API类型
    type: openai
    # glm-4-flash 是免费的，但是还是需要注册填写api_key的
    # 可在这里找到你的api key https://bigmodel.cn/usercenter/proj-mgmt/apikeys
    model_name: glm-4.5-flash
    url: https://open.bigmodel.cn/api/paas/v4/
    api_key: 0b63546842ad4009b7097fd42850562f.eHwjTeI0RxYVhhHs
  DeepseekLLM:
    name: "deepseek-chat"
    # 定义LLM API类型
    type: openai
    # 可在这里找到你的api： https://platform.deepseek.com/api_keys
    model_name: deepseek-chat
    url: https://api.deepseek.com/chat/completions
    api_key: sk-fe532ec7f8314e3d8f81e323f130908f
  OllamaLLM:
    name: "Ollama"
    # 定义LLM API类型
    type: ollama
    model_name: qwen3 #  使用的模型名称，需要预先使用ollama pull下载
    url: http://localhost:11434 # Ollama服务地址
  DoubaoLLM:
    name: "豆包VeLLM"
    # 定义LLM API类型
    type: doubao
    # doubao-seed-1.6-251015 是豆包深度思考模型 deepseek-v3-1-terminus效果比较好
    # 可在这里找到你的api key https://console.volcengine.com/ark
    model_name: doubao-seed-1.6-251015
    url: https://ark.cn-beijing.volces.com/api/v3
    api_key: 你的api_key
    thinking: disabled # 思考模式: disabled(关闭思考) 或 enabled(启用思考)
    max_tokens: 4000
  CozeLLM:
    name: "Coze"
    # 定义LLM API类型
    type: coze
    bot_id: 你的bot_id
    user_id: 你的user_id
    # 正式环境
    # 可以在这里创建一个 OAuth服务类应用，得到client_id、public_key、private_key：https://www.coze.cn/open/oauth/apps
    client_id: 你的coze clientId
    public_key: 你的coze 公钥
    private_key: 你的coze 私钥
    # 个人测试，填了client_id、public_key、private_key此项就不用填了
    # 可在这里找到你的personal_access_token：https://www.coze.cn/open/oauth/pats
    personal_access_token: 你的coze个人令牌
    url: "https://api.coze.cn" # Coze服务地址

# 退出指令
CMD_exit:
  - "退出"
  - "关闭"

# VLLLM配置（视觉语言大模型）
VLLLM:
  ChatGLMVLLM:
    name: "ChatGLM-V"
    type: openai
    model_name: glm-4.6v-flash # 智谱AI的视觉模型
    url: https://open.bigmodel.cn/api/paas/v4/
    api_key: 0b63546842ad4009b7097fd42850562f.eHwjTeI0RxYVhhHs
    max_tokens: 4096
    temperature: 0.7
    top_p: 0.9
    security: # 图片安全配置
      max_file_size: 10485760 # 10MB
      max_pixels: 16777216 # 16M像素
      max_width: 4096
      max_height: 4096
      allowed_formats: ["jpeg", "jpg", "png", "webp", "gif"]
      enable_deep_scan: true
      validation_timeout: 10s
  OllamaVLLM:
    name: "Ollama-V"
    type: ollama
    model_name: qwen2.5vl # 本地视觉模型
    url: http://localhost:11434
    max_tokens: 4096
    temperature: 0.7
    top_p: 0.9
    security: # 图片安全配置
      max_file_size: 10485760 # 10MB
      max_pixels: 16777216 # 16M像素
      max_width: 4096
      max_height: 4096
      allowed_formats: ["jpeg", "jpg", "png", "webp", "gif"]
      enable_deep_scan: true
      validation_timeout: 10s
