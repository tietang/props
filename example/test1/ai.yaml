# 选择使用的模块
default_module:
  asr: DoubaoASR
  tts: EdgeTTS
  llm: ChatGLMLLM
  vllm: ChatGLMVLLM

# ASR配置
ASR:
  DoubaoASR:
    # 火山 流式语音识别大模型-小时版， https://console.volcengine.com/ark/region:ark+cn-beijing/tts/speechRecognition
    # 开通功能，有20小时免费额度
    name: "豆包VeArk"
    type: doubao
    appid: "api-key-20260115163519"
    access_token: 688748d3-ae6b-4c54-a49f-a61a9017ba6b
    output_dir: tmp/
    end_window_size: 300 # 结束窗口大小，单位毫秒，默认400ms，最小200ms

  GoSherpaASR:
    name: "GoSherpa(Remote)"
    type: gosherpa
    addr: "ws://127.0.0.1:8848/asr"

  DeepgramSST:
    name: "Deepgram"
    type: deepgram
    addr: "wss://api.deepgram.com/v1/listen"
    api_key: 你的api_key
    lang: "zh-CN"
    output_dir: tmp/

  StepASR:
    name: "StepFun"
    # https://platform.stepfun.com/docs/llm/realtime
    type: stepfun
    api_key: 你的api_key
    model: "step-audio-2-mini"
    voice: "qingchunshaonv"
    prompt: 你是由阶跃星辰提供的AI聊天助手，你擅长中文、英文及多语种对话。
  SherpaASR:
    name: "GoSherpa(Local)"
    type: gosherpa
    addr: "ws://127.0.0.1:8848/asr"

